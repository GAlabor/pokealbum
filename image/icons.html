<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icone PokeAlbum</title>
<style>
  :root{
    --bg:#060a12;
    --panel:#0b1220;
    --border:rgba(255,255,255,.08);
    --text:#f4f5f7;
    --muted:#b3c0d5;
    --icon:#c7d3ea;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
  }
  body{padding:28px}
  .grid{
    width:min(1100px,100%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:16px;
  }
  .card{
    min-height:170px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:20px;
  }
  .card svg{
    width:58px;
    height:58px;
    color:var(--icon);
    display:block;
  }
  .label{
    color:var(--muted);
    font-size:14px;
    font-weight:650;
    text-align:center;
    line-height:1.25;
  }
</style>
</head>
