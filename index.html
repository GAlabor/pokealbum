  <title>POKEALBUM</title>

  <style>
    :root {
      /* Brand */
      --brand-blue: #1260d1;
      --brand-blue-bright: #3477de;
      --brand-white: #f4f5f7;

      /* Colors */
      --color-bg: #060a12;
      --color-surface-1: #0b1220;
      --color-surface-2: #101a2b;
      --color-text: var(--brand-white);
      --color-muted: #8e9ab0;
      --color-border: rgba(255, 255, 255, .08);
      --color-border-accent: rgba(52, 119, 222, .34);
      --color-overlay: rgba(0, 0, 0, .48);
      --color-control: rgba(255, 255, 255, .06);
      --color-on-accent: #ffffff;

      /* Bottom navigation colors */
      --color-nav: rgba(17, 17, 18, .96);
      --color-nav-muted: #f1f1f3;
      --color-nav-active: #4da3ff;
      --color-nav-indicator: rgba(255, 255, 255, .12);
      --color-nav-indicator-border: rgba(255, 255, 255, .045);
      --color-profile-surface: rgba(16, 26, 43, .92);
      --color-menu-hover: rgba(255, 255, 255, .045);
      --color-input: rgba(255, 255, 255, .055);
      --color-modal: rgba(11, 18, 32, .98);
      --color-glow-top: rgba(52, 119, 222, .20);
      --color-glow-bottom: rgba(0, 55, 162, .12);

      /* Gradients */
      --gradient-accent: linear-gradient(
        180deg,
        var(--brand-blue-bright),
        var(--brand-blue)
      );

      /* Spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;

      /* Sizes */
      --size-icon: 22px;
      --size-control: 44px;
      --size-topbar: 72px;
      --size-tabbar: 74px;
      --size-drawer: 340px;
      --size-page-bottom: 112px;
      --size-avatar: 38px;
      --size-menu-icon: 38px;
      --size-profile-avatar: 92px;

      /* Radius */
      --radius-control: 14px;
      --radius-item: 18px;
      --radius-panel: 24px;

      /* Shadows */
      --shadow-control: 0 8px 24px rgba(0, 0, 0, .22);
      --shadow-floating: 0 16px 44px rgba(0, 0, 0, .34);
      --shadow-accent:
        inset 0 0 0 1px rgba(255, 255, 255, .08),
        0 8px 24px rgba(18, 96, 209, .24);
      --shadow-drawer: -20px 0 52px rgba(0, 0, 0, .40);

      /* Typography */
      --font-ui:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;
      --font-brand-size: 17px;
      --font-title-size: 18px;
      --font-tab-size: 11px;
      --font-brand-weight: 750;
      --font-title-weight: 720;
      --font-tab-weight: 650;

      /* Icons */
      --icon-stroke: 1.9;
      --icon-stroke-nav: 2.15;

      /* Effects */
      --blur-control: 18px;
      --blur-navigation: 24px;

      /* Motion */
      --duration-fast: .18s;
      --duration-normal: .30s;
      --duration-slow: .34s;
      --duration-feedback: .20s;
      --duration-tab-feedback: .26s;
      --ease-standard: cubic-bezier(.25, .8, .25, 1);
      --ease-feedback: cubic-bezier(.2, .8, .2, 1);
      --scale-button-pressed: .94;
      --scale-tab-pop: 1.12;

      /* Splash */
      --splash-bg: #020713;
      --splash-glow: #1274ff;
      --splash-title: #f7f9ff;
      --splash-duration: 2.45s;
      --splash-icon-size: min(62vw, 310px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-ui);
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    button {
      border: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid var(--brand-blue-bright);
      outline-offset: 2px;
    }

    /* Shared button feedback */

    .app-button {
      transform: scale(1);
      transform-origin: center;
      transition:
        transform var(--duration-feedback) var(--ease-feedback),
        filter var(--duration-feedback) ease,
        background-color var(--duration-feedback) ease,
        border-color var(--duration-feedback) ease;
    }

    .app-button.is-pressed {
      transform: scale(var(--scale-button-pressed));
      filter: brightness(.90);
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: var(--size-icon);
      height: var(--size-icon);
      display: block;
      stroke-width: var(--icon-stroke);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* App shell */

    .app {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% -12%, var(--color-glow-top), transparent 34%),
        radial-gradient(circle at 12% 108%, var(--color-glow-bottom), transparent 36%),
        var(--color-bg);
    }

    .topbar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(var(--size-topbar) + env(safe-area-inset-top));
      padding:
        calc(var(--space-4) + env(safe-area-inset-top))
        var(--space-5)
        var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand {
      margin: 0;
      color: var(--color-text);
      font-size: var(--font-brand-size);
      font-weight: var(--font-brand-weight);
      letter-spacing: .09em;
      user-select: none;
    }

    .pages {
      position: absolute;
      inset: 0;
      padding:
        calc(var(--size-topbar) + env(safe-area-inset-top))
        var(--space-5)
        calc(var(--size-page-bottom) + env(safe-area-inset-bottom));
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
    }

    .page.active {
      display: block;
    }

    /* Reusable UI primitives */

    .panel {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-panel);
      background: var(--color-surface-1);
      box-shadow: var(--shadow-floating);
    }

    /* Button variants */
    .button {
      min-height: var(--size-control);
      padding: 0 var(--space-5);
      border-radius: var(--radius-control);
      background: var(--gradient-accent);
      color: var(--color-on-accent);
      font-weight: 700;
      box-shadow: var(--shadow-accent);
      transition: opacity var(--duration-fast) ease;
    }

    .button:active {
      opacity: .92;
    }

    .button.secondary {
      background: var(--color-surface-2);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      box-shadow: none;
    }

    .icon-button {
      width: var(--size-control);
      height: var(--size-control);
      display: grid;
      place-items: center;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      background: var(--color-surface-2);
      box-shadow: var(--shadow-control);
      transition:
        border-color var(--duration-fast) ease,
        background var(--duration-fast) ease;
    }


    .profile-button {
      color: var(--brand-blue-bright);
      border-color: var(--color-border-accent);
      background: var(--color-profile-surface);
      backdrop-filter: blur(var(--blur-control)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--blur-control)) saturate(150%);
      pointer-events: auto;
    }

    .close-button {
      color: var(--color-muted);
      background: var(--color-control);
      box-shadow: none;
    }

    /* Bottom navigation */

    .bottom-wrap {
      position: absolute;
      inset: auto 0 0;
      z-index: 12;
      padding:
        var(--space-3)
        var(--space-4)
        calc(var(--space-3) + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .tabbar {
      position: relative;
      width: min(520px, 100%);
      height: var(--size-tabbar);
      padding: var(--space-2);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: var(--space-1);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-panel);
      background: var(--color-nav);
      box-shadow: var(--shadow-floating);
      backdrop-filter: blur(var(--blur-navigation)) saturate(145%);
      -webkit-backdrop-filter: blur(var(--blur-navigation)) saturate(145%);
      pointer-events: auto;
    }

    .tab-indicator {
      position: absolute;
      top: var(--space-2);
      left: 0;
      z-index: 0;
      height: calc(100% - (var(--space-2) * 2));
      border: 1px solid var(--color-nav-indicator-border);
      border-radius: var(--radius-item);
      background: var(--color-nav-indicator);
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      transition:
        transform var(--duration-slow) var(--ease-standard),
        width var(--duration-slow) var(--ease-standard);
    }

    .tab-indicator.no-transition {
      transition: none;
    }

    .tab {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border-radius: var(--radius-item);
      color: var(--color-nav-muted);
      transform: scale(1);
      transform-origin: center;
      transition:
        color var(--duration-fast) ease,
        transform var(--duration-tab-feedback) var(--ease-feedback);
    }

    .tab .icon {
      stroke-width: var(--icon-stroke-nav);
    }

    .tab span {
      max-width: 100%;
      overflow: hidden;
      font-size: var(--font-tab-size);
      line-height: 1;
      font-weight: var(--font-tab-weight);
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: .88;
      transition:
        color var(--duration-fast) ease,
        opacity var(--duration-fast) ease;
    }

    .tab.active {
      color: var(--color-nav-active);
    }

    .tab.active span {
      opacity: 1;
    }

    .tab.is-tapping {
      animation: tab-pop var(--duration-tab-feedback) var(--ease-feedback);
    }

    @keyframes tab-pop {
      0%,
      100% {
        transform: scale(1);
      }

      48% {
        transform: scale(var(--scale-tab-pop));
      }
    }

    /* Drawer */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: var(--color-overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-normal) ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 40;
      width: min(84vw, var(--size-drawer));
      padding:
        calc(var(--space-5) + env(safe-area-inset-top))
        var(--space-5)
        calc(var(--space-5) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      background: var(--color-surface-1);
      border-left: 1px solid var(--color-border);
      box-shadow: var(--shadow-drawer);
      transform: translate3d(100%, 0, 0);
      transition: transform var(--duration-slow) var(--ease-standard);
      will-change: transform;
    }

    .drawer.open {
      transform: translate3d(0, 0, 0);
    }

    .drawer-head {
      min-height: var(--size-control);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      margin: 0;
      font-size: var(--font-title-size);
      font-weight: var(--font-title-weight);
      letter-spacing: -.02em;
    }

    /* Drawer menu */

    .drawer-menu {
      margin-top: var(--space-5);
      display: grid;
      gap: var(--space-1);
    }

    .menu-item {
      width: 100%;
      min-height: 52px;
      padding: var(--space-2);
      display: grid;
      grid-template-columns: var(--size-menu-icon) 1fr;
      align-items: center;
      gap: var(--space-3);
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      color: var(--color-text);
      text-align: left;
      background: transparent;
    }

    .menu-item:focus-visible {
      border-color: var(--color-border-accent);
    }

    .menu-item-icon {
      width: var(--size-menu-icon);
      height: var(--size-menu-icon);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--color-text);
    }

    .menu-item-icon .icon {
      width: 20px;
      height: 20px;
    }

    .menu-item-avatar {
      border-radius: 50%;
      background: var(--gradient-accent);
      color: var(--color-on-accent);
      font-size: 15px;
      font-weight: 750;
      box-shadow: var(--shadow-accent);
    }

    .menu-item-avatar.has-image {
      background: var(--color-surface-2);
      box-shadow: none;
    }

    .menu-item-avatar img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
    }

    .menu-item-avatar.has-image img {
      display: block;
    }

    .menu-item-avatar.has-image .avatar-initial {
      display: none;
    }

    .menu-item-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .menu-item-label {
      min-width: 0;
      overflow: hidden;
      font-size: 15px;
      font-weight: 620;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-item-value {
      overflow: hidden;
      color: var(--color-muted);
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Profile editor */

    .profile-editor {
      display: grid;
      justify-items: center;
      gap: var(--space-5);
    }

    .profile-avatar-button {
      position: relative;
      width: var(--size-profile-avatar);
      height: var(--size-profile-avatar);
      padding: 0;
      overflow: visible;
      border-radius: 50%;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: var(--gradient-accent);
      color: var(--color-on-accent);
      font-size: 34px;
      font-weight: 750;
      box-shadow: var(--shadow-accent);
    }

    .profile-avatar.has-image {
      background: var(--color-surface-2);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
    }

    .profile-avatar.has-image img {
      display: block;
    }

    .profile-avatar.has-image .avatar-initial {
      display: none;
    }

    .profile-avatar-badge {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--color-modal);
      border-radius: 50%;
      background: var(--brand-blue);
      color: white;
    }

    .profile-avatar-badge .icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transform: translateY(-.25px);
    }

    .profile-fields {
      width: 100%;
      display: grid;
      gap: var(--space-3);
    }

    .field-label {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .image-input {
      display: none;
    }

    /* Modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      padding:
        calc(var(--space-6) + env(safe-area-inset-top))
        var(--space-5)
        calc(var(--space-6) + env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .56);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity var(--duration-normal) ease,
        visibility var(--duration-normal) ease;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-panel {
      width: min(100%, 390px);
      padding: var(--space-5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-panel);
      background: var(--color-modal);
      box-shadow: var(--shadow-floating);
      transform: scale(.96);
      transition: transform var(--duration-normal) var(--ease-standard);
    }

    .modal.open .modal-panel {
      transform: scale(1);
    }

    .modal-title {
      margin: 0;
      font-size: var(--font-title-size);
      font-weight: var(--font-title-weight);
    }

    .modal-field {
      margin-top: var(--space-5);
    }

    .text-input {
      width: 100%;
      height: 48px;
      padding: 0 var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      outline: 0;
      background: var(--color-input);
      color: var(--color-text);
      font: inherit;
    }

    .text-input:focus {
      border-color: var(--brand-blue-bright);
      box-shadow: 0 0 0 3px rgba(52, 119, 222, .14);
    }

    .modal-actions {
      margin-top: var(--space-5);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
    }

    /* Splash screen */

    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(18, 116, 255, .16), transparent 28%),
        radial-gradient(circle at 50% 48%, rgba(0, 55, 162, .10), transparent 48%),
        var(--splash-bg);
      opacity: 1;
      visibility: visible;
    }

    .splash.is-leaving {
      animation: splash-exit .48s var(--ease-standard) forwards;
    }

    .splash-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(44px, 7vh, 72px);
      transform: translateY(-2vh);
    }

    .splash-logo {
      position: relative;
      width: var(--splash-icon-size);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .splash-logo::before,
    .splash-logo::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: var(--splash-glow);
      opacity: 0;
      filter: blur(42px);
      transform: scale(.72);
      animation: splash-aura var(--splash-duration) var(--ease-standard) forwards;
      pointer-events: none;
    }

    .splash-logo::after {
      inset: 24%;
      filter: blur(72px);
      animation-delay: .12s;
    }

    .splash-logo img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .78;
      transform: scale(.91);
      filter:
        brightness(.72)
        saturate(.82)
        drop-shadow(0 0 0 rgba(18, 116, 255, 0));
      animation: splash-logo var(--splash-duration) var(--ease-standard) forwards;
    }

    .splash-title {
      margin: 0;
      color: var(--splash-title);
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: .34em;
      text-indent: .34em;
      opacity: 0;
      transform: translateY(12px);
      text-shadow:
        0 0 16px rgba(255, 255, 255, .16),
        0 0 30px rgba(18, 116, 255, .22);
      animation: splash-title 1s var(--ease-standard) 1.05s forwards;
    }

    @keyframes splash-logo {
      0% {
        opacity: .72;
        transform: scale(.91);
        filter:
          brightness(.65)
          saturate(.78)
          drop-shadow(0 0 0 rgba(18, 116, 255, 0));
      }

      48% {
        opacity: 1;
        transform: scale(1.025);
        filter:
          brightness(1.14)
          saturate(1.10)
          drop-shadow(0 0 18px rgba(18, 116, 255, .72))
          drop-shadow(0 0 42px rgba(18, 116, 255, .50));
      }

      72%,
      100% {
        opacity: 1;
        transform: scale(1);
        filter:
          brightness(1.05)
          saturate(1.04)
          drop-shadow(0 0 14px rgba(18, 116, 255, .58))
          drop-shadow(0 0 34px rgba(18, 116, 255, .36));
      }
    }

    @keyframes splash-aura {
      0% {
        opacity: 0;
        transform: scale(.72);
      }

      50% {
        opacity: .34;
        transform: scale(1.04);
      }

      100% {
        opacity: .20;
        transform: scale(.96);
      }
    }

    @keyframes splash-title {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-exit {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Responsive */

    @media (min-width: 700px) {
      .topbar {
        padding-left: var(--space-7);
        padding-right: var(--space-7);
      }

      .bottom-wrap {
        padding-left: var(--space-6);
        padding-right: var(--space-6);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-delay: 0s !important;
      }
    }
  </style>
</head>

      <path d="M9 20v-5.5h6V20" fill="none" stroke="currentColor" />
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.75" cy="10.75" r="6.25" fill="none" stroke="currentColor" />
      <path d="m15.4 15.4 4.1 4.1" fill="none" stroke="currentColor" />
    </symbol>

    <symbol id="icon-collection" viewBox="0 0 24 24">
      <rect x="4" y="5" width="11" height="14" rx="2.1" fill="none" stroke="currentColor" />
      <path d="M8 5.1V4.5A1.5 1.5 0 0 1 9.5 3h8A2.5 2.5 0 0 1 20 5.5v10A1.5 1.5 0 0 1 18.5 17H15" fill="none" stroke="currentColor" />
    </symbol>

    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" />
    </symbol>

    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M7.5 18.5h9.25a4.25 4.25 0 0 0 .55-8.46A5.75 5.75 0 0 0 6.15 8.65 4.95 4.95 0 0 0 7.5 18.5Z" fill="none" stroke="currentColor" />
    </symbol>

    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle
        cx="12"
        cy="12"
        r="3.15"
        fill="none"
        stroke="currentColor"
      />
      <path
        d="M9.55 4.15 10.1 2.6h3.8l.55 1.55c.55.17 1.08.4 1.58.68l1.5-.7 2.7 2.7-.7 1.5c.28.5.51 1.03.68 1.58l1.55.55v3.8l-1.55.55c-.17.55-.4 1.08-.68 1.58l.7 1.5-2.7 2.7-1.5-.7c-.5.28-1.03.51-1.58.68l-.55 1.55h-3.8l-.55-1.55a8.8 8.8 0 0 1-1.58-.68l-1.5.7-2.7-2.7.7-1.5a8.8 8.8 0 0 1-.68-1.58l-1.55-.55v-3.8l1.55-.55c.17-.55.4-1.08.68-1.58l-.7-1.5 2.7-2.7 1.5.7c.5-.28 1.03-.51 1.58-.68Z"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>

    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path d="M8.5 6.5 10 4.5h4l1.5 2H18A2.5 2.5 0 0 1 20.5 9v8A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17V9A2.5 2.5 0 0 1 6 6.5h2.5Z" fill="none" stroke="currentColor" />
      <circle cx="12" cy="13" r="3.25" fill="none" stroke="currentColor" />
    </symbol>
  </svg>

  <main class="app">
    <header class="topbar">
      <h1 class="brand" id="greeting">Ciao</h1>

      <button
        class="icon-button profile-button app-button"
        id="openProfile"
        type="button"
        aria-label="Apri profilo"
        aria-controls="profileDrawer"
        aria-expanded="false"
      >
        <svg class="icon" aria-hidden="true">
          <use href="#icon-profile"></use>
        </svg>
      </button>
    </header>

    <section class="pages">
      <div class="page active" data-page="home"></div>
      <div class="page" data-page="search"></div>
      <div class="page" data-page="collection"></div>
    </section>

    <div class="bottom-wrap">
      <nav class="tabbar" aria-label="Navigazione principale">
        <div class="tab-indicator" id="tabIndicator" aria-hidden="true"></div>

        <button class="tab active" type="button" data-target="home" aria-current="page">
          <svg class="icon" aria-hidden="true">
            <use href="#icon-home"></use>
          </svg>
          <span>Home</span>
        </button>

        <button class="tab" type="button" data-target="search">
          <svg class="icon" aria-hidden="true">
            <use href="#icon-search"></use>
          </svg>
          <span>Cerca</span>
        </button>

        <button class="tab" type="button" data-target="collection">
          <svg class="icon" aria-hidden="true">
            <use href="#icon-collection"></use>
          </svg>
          <span>Collezione</span>
        </button>
      </nav>
    </div>

    <div class="overlay" id="overlay"></div>

    <aside
      class="drawer"
      id="profileDrawer"
      aria-label="Menu profilo"
      aria-hidden="true"
      inert
    >
      <div class="drawer-head">
        <h2 class="drawer-title">POKEALBUM</h2>

        <button
          class="icon-button close-button app-button"
          id="closeProfile"
          type="button"
          aria-label="Chiudi menu"
        >
          <svg class="icon" aria-hidden="true">
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>

      <nav class="drawer-menu" aria-label="Menu POKEALBUM">
        <button class="menu-item app-button" id="openProfileEditor" type="button">
          <span class="menu-item-icon menu-item-avatar" id="profileAvatarSmall">
            <span class="avatar-initial" id="profileInitial">?</span>
            <img id="profileImageSmall" alt="">
          </span>

          <span class="menu-item-label" id="profileMenuLabel">Nome visualizzato</span>
        </button>

        <button class="menu-item app-button" id="connectCloud" type="button">
          <span class="menu-item-icon">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-cloud"></use>
            </svg>
          </span>

          <span class="menu-item-copy">
            <span class="menu-item-label">Cloud</span>
            <span class="menu-item-value">Nessun Drive collegato</span>
          </span>
        </button>

        <button class="menu-item app-button" id="openSettings" type="button">
          <span class="menu-item-icon">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-settings"></use>
            </svg>
          </span>

          <span class="menu-item-label">Impostazioni</span>
        </button>
      </nav>
    </aside>

    <div
      class="modal"
      id="profileModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileModalTitle"
      aria-hidden="true"
    >
      <div class="modal-panel">
        <h2 class="modal-title" id="profileModalTitle">Profilo</h2>

        <form class="profile-editor" id="profileForm">
          <button
            class="profile-avatar-button app-button"
            id="changeProfileImage"
            type="button"
            aria-label="Modifica immagine profilo"
          >
            <span class="profile-avatar" id="profileAvatarLarge">
              <span class="avatar-initial" id="profileInitialLarge">?</span>
              <img id="profileImageLarge" alt="">
            </span>

            <span class="profile-avatar-badge">
              <svg class="icon" aria-hidden="true">
                <use href="#icon-camera"></use>
              </svg>
            </span>
          </button>

          <input
            class="image-input"
            id="profileImageInput"
            type="file"
            accept="image/*"
          >

          <div class="profile-fields">
            <label class="field-label" for="profileNameInput">Nome visualizzato</label>

            <input
              class="text-input"
              id="profileNameInput"
              type="text"
              maxlength="24"
              autocomplete="name"
              placeholder="Inserisci il nome"
            >
          </div>

          <div class="modal-actions">
            <button class="button secondary app-button" id="cancelProfile" type="button">
              Annulla
            </button>

            <button class="button app-button" type="submit">
              Salva
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const splash = document.getElementById("splash");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function dismissSplash() {
      if (!splash) return;

      splash.classList.add("is-leaving");

      splash.addEventListener(
        "animationend",
        () => splash.remove(),
        { once: true }
      );
    }

    const SPLASH_DURATION = 2450;
    const splashDelay = prefersReducedMotion.matches ? 150 : SPLASH_DURATION;

    window.setTimeout(dismissSplash, splashDelay);

    const tabs = [...document.querySelectorAll(".tab")];
    const pages = [...document.querySelectorAll(".page")];

    const tabbar = document.querySelector(".tabbar");
    const indicator = document.getElementById("tabIndicator");
    const drawer = document.getElementById("profileDrawer");
    const overlay = document.getElementById("overlay");
    const openProfile = document.getElementById("openProfile");
    const closeProfile = document.getElementById("closeProfile");

    const greeting = document.getElementById("greeting");
    const profileInitial = document.getElementById("profileInitial");
    const profileInitialLarge = document.getElementById("profileInitialLarge");
    const profileMenuLabel = document.getElementById("profileMenuLabel");
    const profileAvatarSmall = document.getElementById("profileAvatarSmall");
    const profileAvatarLarge = document.getElementById("profileAvatarLarge");
    const profileImageSmall = document.getElementById("profileImageSmall");
    const profileImageLarge = document.getElementById("profileImageLarge");
    const openProfileEditor = document.getElementById("openProfileEditor");

    const profileModal = document.getElementById("profileModal");
    const profileForm = document.getElementById("profileForm");
    const profileNameInput = document.getElementById("profileNameInput");
    const profileImageInput = document.getElementById("profileImageInput");
    const changeProfileImage = document.getElementById("changeProfileImage");
    const cancelProfile = document.getElementById("cancelProfile");

    const DISPLAY_NAME_KEY = "pokealbum.displayName";
    const PROFILE_IMAGE_KEY = "pokealbum.profileImage";

    let pendingProfileImage = "";

    let pressedButton = null;

    function setPressedButton(button) {
      if (pressedButton === button) return;

      pressedButton?.classList.remove("is-pressed");
      pressedButton = button;
      pressedButton?.classList.add("is-pressed");
    }

    document.addEventListener("pointerdown", (event) => {
      setPressedButton(event.target.closest("button.app-button"));
    });

    ["pointerup", "pointercancel"].forEach((type) => {
      document.addEventListener(type, () => setPressedButton(null));
    });

    window.addEventListener("blur", () => setPressedButton(null));

    function positionIndicator(tab, instant = false) {
      if (!tab) return;

      indicator.classList.toggle("no-transition", instant);
      indicator.style.width = `${tab.offsetWidth}px`;
      indicator.style.transform = `translate3d(${tab.offsetLeft}px, 0, 0)`;

      if (instant) {
        requestAnimationFrame(() => {
          indicator.classList.remove("no-transition");
        });
      }
    }

    function animateTab(tab) {
      tab.classList.remove("is-tapping");
      void tab.offsetWidth;
      tab.classList.add("is-tapping");

      tab.addEventListener(
        "animationend",
        () => tab.classList.remove("is-tapping"),
        { once: true }
      );
    }

    function activateTab(tab) {
      const changed = !tab.classList.contains("active");

      if (changed) {
        tabs.forEach((item) => {
          const active = item === tab;

          item.classList.toggle("active", active);

          if (active) {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });

        pages.forEach((page) => {
          page.classList.toggle("active", page.dataset.page === tab.dataset.target);
        });

        positionIndicator(tab);
      }

      animateTab(tab);
    }

    function normalizeDisplayName(value) {
      return value.trim().replace(/\s+/g, " ");
    }

    function getInitial(name) {
      return name ? name.charAt(0).toLocaleUpperCase("it-IT") : "?";
    }

    function renderProfile() {
      const name = localStorage.getItem(DISPLAY_NAME_KEY) || "";
      const image = localStorage.getItem(PROFILE_IMAGE_KEY) || "";
      const initial = getInitial(name);

      greeting.textContent = name ? `Ciao, ${name}` : "Ciao";
      profileMenuLabel.textContent = name || "Nome visualizzato";
      profileInitial.textContent = initial;
      profileInitialLarge.textContent = initial;

      [profileAvatarSmall, profileAvatarLarge].forEach((avatar) => {
        avatar.classList.toggle("has-image", Boolean(image));
      });

      [profileImageSmall, profileImageLarge].forEach((element) => {
        element.src = image;
      });
    }

    function saveProfile(name, image) {
      const normalizedName = normalizeDisplayName(name);

      if (normalizedName) {
        localStorage.setItem(DISPLAY_NAME_KEY, normalizedName);
      } else {
        localStorage.removeItem(DISPLAY_NAME_KEY);
      }

      if (image) {
        localStorage.setItem(PROFILE_IMAGE_KEY, image);
      } else {
        localStorage.removeItem(PROFILE_IMAGE_KEY);
      }

      renderProfile();
    }

    function setProfileModal(open) {
      profileModal.classList.toggle("open", open);
      profileModal.setAttribute("aria-hidden", String(!open));

      if (open) {
        profileNameInput.value = localStorage.getItem(DISPLAY_NAME_KEY) || "";
        pendingProfileImage = localStorage.getItem(PROFILE_IMAGE_KEY) || "";

        requestAnimationFrame(() => {
          profileNameInput.focus();
        });
      }
    }

    function resizeProfileImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = reject;

        reader.onload = () => {
          const image = new Image();

          image.onerror = reject;

          image.onload = () => {
            const size = 256;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = size;
            canvas.height = size;

            const scale = Math.max(size / image.width, size / image.height);
            const width = image.width * scale;
            const height = image.height * scale;
            const x = (size - width) / 2;
            const y = (size - height) / 2;

            context.drawImage(image, x, y, width, height);

            resolve(canvas.toDataURL("image/jpeg", .86));
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    function setDrawer(open) {
      drawer.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
      drawer.toggleAttribute("inert", !open);

      drawer.setAttribute("aria-hidden", String(!open));
      openProfile.setAttribute("aria-expanded", String(open));
    }

    tabbar.addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");

      if (tab) {
        activateTab(tab);
      }
    });

    openProfile.addEventListener("click", () => setDrawer(true));
    closeProfile.addEventListener("click", () => setDrawer(false));
    overlay.addEventListener("click", () => setDrawer(false));

    openProfileEditor.addEventListener("click", () => setProfileModal(true));
    cancelProfile.addEventListener("click", () => setProfileModal(false));

    changeProfileImage.addEventListener("click", () => {
      profileImageInput.click();
    });

    profileImageInput.addEventListener("change", async () => {
      const [file] = profileImageInput.files;

      if (!file) return;

      pendingProfileImage = await resizeProfileImage(file);

      profileAvatarLarge.classList.add("has-image");
      profileImageLarge.src = pendingProfileImage;
    });

    profileModal.addEventListener("click", (event) => {
      if (event.target === profileModal) {
        setProfileModal(false);
      }
    });

    profileForm.addEventListener("submit", (event) => {
      event.preventDefault();
      saveProfile(profileNameInput.value, pendingProfileImage);
      setProfileModal(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;

      if (profileModal.classList.contains("open")) {
        setProfileModal(false);
      } else if (drawer.classList.contains("open")) {
        setDrawer(false);
      }
    });

    function syncIndicator() {
      positionIndicator(tabbar.querySelector(".tab.active"), true);
    }

    const navigationObserver = new ResizeObserver(syncIndicator);

    navigationObserver.observe(tabbar);
    requestAnimationFrame(syncIndicator);

    renderProfile();
  </script>
</body>
</html>
