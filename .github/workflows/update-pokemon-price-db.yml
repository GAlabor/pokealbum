name: Update Pokemon Price DB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-price-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pokemon Price DB
        run: node scripts/build_price.js
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}

      - name: Commit and push price DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/pokemon-prices.json data/pokemon-prices-meta.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai prezzi."
            exit 0
          fi

          git commit -m "Auto update Pokemon Price DB"
          git pull --rebase origin main
          git push
